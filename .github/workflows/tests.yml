# Lint + the full test suite on a real Windows machine, for every push and pull request.
# Most of JARVIS's bugs hid because the tests only ever ran on Linux, where every Windows
# call is a harmless "only available on Windows".
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen          # Qt widgets without a display
      JARVIS_STRICT_GUARD: "1"            # a test that touches the real PC fails (tests/conftest.py)
      JARVIS_DECISION_ENGINE: rules       # no Laya model download
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          # Leave out the heavy optional models (Laya/PyTorch, Whisper, Kokoro); JARVIS and its
          # tests run without them. winsdk has no wheel for every Python, so it is best-effort.
          (Get-Content requirements.txt) -notmatch '^\s*(laya|faster-whisper|kokoro-onnx|winsdk)\b' |
            Set-Content requirements-ci.txt
          python -m pip install -r requirements-ci.txt pytest ruff
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install winsdk
          if ($LASTEXITCODE -ne 0) { Write-Host "::notice::winsdk not available on Python ${{ matrix.python-version }}; its features are skipped." }
          exit 0

      - name: Lint (real bugs only, see ruff.toml)
        run: python -m ruff check .

      - name: Tests
        run: python -m pytest -q -p no:cacheprovider -rfE
